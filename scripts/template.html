<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="rating" content="adult">
<title>{{PLATFORM}} | {{SITE_TITLE}}</title>
<link rel="stylesheet" href="../assets/site.css">
<script src="../assets/site.js" defer></script>
</head>
<body>
<div id="age" role="dialog" aria-modal="true" aria-labelledby="age-title">
  <div class="box">
    <h2 id="age-title">年齢確認</h2>
    <p>このサイトはアダルトコンテンツを含みます。<br>18歳未満の方はご利用いただけません。</p>
    <div class="btns">
      <button class="yes" type="button">18歳以上です</button>
      <a class="no" href="https://www.google.com/">退出する</a>
    </div>
  </div>
</div>
<header class="topbar">
  <p class="notice">当サイトはアフィリエイトプログラムを利用しています。 ・ Powered by FANZA Webサービス</p>
  <nav class="nav" aria-label="プラットフォーム">
    <a class="logo" href="../">{{SITE_TITLE}}</a>
    {{MENU}}
  </nav>
</header>
<main>
  <div class="head">
    <h1>{{PLATFORM}}</h1>
    <p class="sub">{{DATE}} 更新 ・ {{COUNT}} 本</p>
  </div>
  <ul class="grid" data-catalog="catalog.json">
{{CARDS}}
  </ul>
</main>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
