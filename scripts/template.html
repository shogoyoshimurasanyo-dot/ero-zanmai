<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="rating" content="adult">
<title>{{SITE_TITLE}}</title>
<style>
  :root {
    --bg: #0f0f12; --panel: #1a1a20; --line: #2a2a33;
    --text: #ececf1; --muted: #9a9aa8; --accent: #ff3d6e; --accent-ink: #fff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif; line-height: 1.5; }
  header { padding: 20px 16px 8px; max-width: 1400px; margin: 0 auto; }
  h1 { margin: 0; font-size: 22px; }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  main { max-width: 1400px; margin: 0 auto; padding: 8px 16px 40px; }
  .grid { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px;
          grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
          display: flex; flex-direction: column; }
  .thumb { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; padding: 0; border: 0;
           background: #000; cursor: pointer; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .2s; }
  .thumb:hover img { transform: scale(1.03); }
  .thumb iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .play { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px;
          border-radius: 50%; background: rgba(0,0,0,.6); border: 2px solid #fff; }
  .play::after { content: ""; position: absolute; left: 21px; top: 15px;
                 border-style: solid; border-width: 12px 0 12px 18px; border-color: transparent transparent transparent #fff; }
  .rank { position: absolute; left: 8px; top: 8px; background: var(--accent); color: var(--accent-ink);
          font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
  .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .title { margin: 0; font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { margin: 0; font-size: 12px; color: var(--muted); }
  .cta { margin-top: auto; display: block; text-align: center; background: var(--accent); color: var(--accent-ink);
         text-decoration: none; font-size: 13px; font-weight: 700; padding: 8px; border-radius: 6px; }
  .cta:hover { filter: brightness(1.1); }
  .notice { margin: 0; padding: 6px 16px; text-align: center; color: var(--muted); font-size: 12px;
            background: var(--panel); border-bottom: 1px solid var(--line); }
  #age { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none; align-items: center;
         justify-content: center; z-index: 10; padding: 16px; }
  #age.show { display: flex; }
  #age .box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px;
              max-width: 420px; text-align: center; }
  #age h2 { margin: 0 0 8px; font-size: 20px; }
  #age p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  #age .btns { display: flex; gap: 12px; justify-content: center; }
  #age button, #age a { font: inherit; font-weight: 700; padding: 10px 20px; border-radius: 6px; border: 0;
                        cursor: pointer; text-decoration: none; }
  #age .yes { background: var(--accent); color: var(--accent-ink); }
  #age .no { background: var(--line); color: var(--text); }
</style>
</head>
<body>
<div id="age" role="dialog" aria-modal="true" aria-labelledby="age-title">
  <div class="box">
    <h2 id="age-title">年齢確認</h2>
    <p>このサイトはアダルトコンテンツを含みます。<br>18歳未満の方はご利用いただけません。</p>
    <div class="btns">
      <button class="yes" type="button">18歳以上です</button>
      <a class="no" href="https://www.google.com/">退出する</a>
    </div>
  </div>
</div>
<p class="notice">当サイトはアフィリエイトプログラムを利用しています。 ・ Powered by FANZA Webサービス</p>
<header>
  <h1>{{SITE_TITLE}}</h1>
  <p class="sub">{{DATE}} 更新 ・ 本日の {{COUNT}} 本（サムネイルをタップでサンプル再生）</p>
</header>
<main>
  <ul class="grid">
{{CARDS}}
  </ul>
</main>
<script>
  (function () {
    var age = document.getElementById('age');
    var ok = false;
    try { ok = localStorage.getItem('age_ok') === '1'; } catch (e) {}
    if (!ok) age.classList.add('show');
    age.querySelector('.yes').addEventListener('click', function () {
      try { localStorage.setItem('age_ok', '1'); } catch (e) {}
      age.classList.remove('show');
    });
    document.querySelector('.grid').addEventListener('click', function (ev) {
      var btn = ev.target.closest('button.thumb');
      if (!btn) return;
      var box = document.createElement('div');
      box.className = 'thumb';
      var f = document.createElement('iframe');
      f.src = btn.dataset.player;
      f.title = btn.getAttribute('aria-label');
      f.allow = 'autoplay; fullscreen; encrypted-media; picture-in-picture';
      f.allowFullscreen = true;
      f.setAttribute('scrolling', 'no');
      f.referrerPolicy = 'no-referrer-when-downgrade';
      box.appendChild(f);
      btn.replaceWith(box);
    });
  })();
</script>
</body>
</html>
